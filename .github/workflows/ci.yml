name: CI
on:
  push:
  pull_request:
jobs:
  ha-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install -r requirements-test.txt
          pip install "pypopur==0.1.5"
      - name: Lint
        run: ruff check custom_components tests_ha
      - name: Test
        run: python -m pytest tests_ha/ -v
